name: Build Application

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-master-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop branch for master PRs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "master" ] && { [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; }; then
            echo "::error::PRs into master must come from the develop branch in this repository."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v2
        with: 
          meteor-release: 3.5
      
      - run: meteor npm install -g yarn
      
      - name: Install Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-web

      - name: Build Application
        run: meteor yarn run build
        working-directory: ./idreesia-web