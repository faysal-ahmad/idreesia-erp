name: Release Application

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true && (github.event.pull_request.base.ref != 'master' || (github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Check Existing Release Version
        id: existing-release
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "${BASE_REF}" --tags
          release_commit=$(git log "origin/${BASE_REF}" --grep="for PR #${PR_NUMBER}" -n 1 --format=%H || true)
          subject=""
          if [ -n "$release_commit" ]; then
            subject=$(git log -1 --format=%s "$release_commit")
          fi
          version=$(echo "$subject" | sed -nE 's/^chore\(release\): ([^ ]+) for PR #[0-9]+ \[skip ci\]$/\1/p')
          if [ -z "$version" ]; then
            version=$(git for-each-ref refs/tags --format='%(refname:short)|%(contents:subject)' | sed -nE "s/^v([^|]+)\\|Release [^ ]+ for PR #${PR_NUMBER}$/\\1/p" | sort -V | tail -n 1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Merge Commit
        if: steps.existing-release.outputs.version == ''
        run: git checkout -B "release-pr-${{ github.event.pull_request.number }}" "${{ github.event.pull_request.merge_commit_sha }}"

      - name: Resolve Release Version
        id: release-version
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          EXISTING_VERSION: ${{ steps.existing-release.outputs.version }}
        run: |
          if [ -n "$EXISTING_VERSION" ]; then
            node scripts/resolve-release-version.mjs \
              --branch "${{ github.event.pull_request.base.ref }}" \
              --resolved-version "$EXISTING_VERSION"
          else
            node scripts/resolve-release-version.mjs \
              --branch "${{ github.event.pull_request.base.ref }}" \
              --labels "$PR_LABELS" \
              --write
          fi

      - name: Checkout Existing Release Ref
        if: steps.existing-release.outputs.version != ''
        env:
          RELEASE_COMMIT: ${{ steps.existing-release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            git checkout "$tag"
          elif [ -n "$RELEASE_COMMIT" ]; then
            git checkout "$RELEASE_COMMIT"
          else
            echo "::error::Could not find release tag or commit for $tag."
            exit 1
          fi

      - name: Commit Release Version
        if: steps.existing-release.outputs.version == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json idreesia-web/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.release-version.outputs.version }} for PR #${{ github.event.pull_request.number }} [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.base.ref }}
          fi

      - name: Tag Release Version
        run: |
          tag="v${{ steps.release-version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git tag -a "$tag" -m "Release ${{ steps.release-version.outputs.version }} for PR #${{ github.event.pull_request.number }}"
            git push origin "$tag"
          fi

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: 3.5

      - run: meteor npm install -g yarn

      - name: Install Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-web

      - name: Build Application
        run: meteor yarn run build
        working-directory: ./idreesia-web

      - name: Build Docker Container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/idreesia-web
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          BUILD_ARGS=()
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=("-t" "$IMAGE_NAME:$tag")
          done
          docker build "${BUILD_ARGS[@]}" idreesia-web

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Docker Container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/idreesia-web
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          for tag in "${TAGS[@]}"; do
            docker push "$IMAGE_NAME:$tag"
          done