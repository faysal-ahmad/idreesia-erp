name: Release Application

on:
  push:
    branches:
      - develop
      - master

# Production URLs baked into the store builds of the mobile app.
env:
  MOBILE_BACKEND_URL: https://idreesia.app
  MOBILE_SERVER_URL: https://mobile.idreesia.app
  MOBILE_ROCKETCHAT_URL: https://rocketchat.idreesia.app

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Resolve Merged PR
        id: merged-pr
        uses: actions/github-script@v9
        with:
          script: |
            const base = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              base,
              sort: 'updated',
              direction: 'desc',
              per_page: 20,
            });
            const merged = pulls.find((pr) => pr.merge_commit_sha === context.sha);
            if (!merged) {
              core.setFailed(`Could not find merged PR for ${context.sha} on ${base}.`);
              return;
            }
            if (
              base === 'master' &&
              (merged.head.ref !== 'develop' || merged.head.repo.full_name !== `${owner}/${repo}`)
            ) {
              core.setFailed('Releases to master must come from the develop branch in this repository.');
              return;
            }
            core.setOutput('number', merged.number);
            core.setOutput('labels', JSON.stringify(merged.labels.map((label) => label.name)));

      - name: Check Existing Release Version
        id: existing-release
        env:
          BASE_REF: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.merged-pr.outputs.number }}
        run: |
          git fetch origin "${BASE_REF}" --tags
          release_commit=$(git log "origin/${BASE_REF}" --grep="for PR #${PR_NUMBER}" -n 1 --format=%H || true)
          subject=""
          if [ -n "$release_commit" ]; then
            subject=$(git log -1 --format=%s "$release_commit")
          fi
          version=$(echo "$subject" | sed -nE 's/^chore\(release\): ([^ ]+) for PR #[0-9]+ \[skip ci\]$/\1/p')
          if [ "$BASE_REF" = "master" ] && [ -z "$version" ]; then
            version=$(git for-each-ref refs/tags --format='%(refname:short)|%(contents:subject)' | sed -nE "s/^v([^|]+)\\|Release [^ ]+ for PR #${PR_NUMBER}$/\\1/p" | sort -V | tail -n 1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve Release Version
        id: release-version
        env:
          BRANCH: ${{ github.ref_name }}
          PR_LABELS: ${{ steps.merged-pr.outputs.labels }}
          EXISTING_VERSION: ${{ steps.existing-release.outputs.version }}
        run: |
          if [ -n "$EXISTING_VERSION" ]; then
            node scripts/resolve-release-version.mjs \
              --branch "$BRANCH" \
              --resolved-version "$EXISTING_VERSION"
          elif [ "$BRANCH" = "develop" ]; then
            node scripts/resolve-release-version.mjs \
              --branch "$BRANCH" \
              --labels "$PR_LABELS" \
              --write
          else
            node scripts/resolve-release-version.mjs \
              --branch "$BRANCH" \
              --labels "$PR_LABELS"
          fi

      - name: Checkout Existing Release Ref
        if: steps.existing-release.outputs.version != ''
        env:
          RELEASE_COMMIT: ${{ steps.existing-release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            git checkout "$tag"
          elif [ -n "$RELEASE_COMMIT" ]; then
            git checkout "$RELEASE_COMMIT"
          else
            echo "::error::Could not find release tag or commit for $tag."
            exit 1
          fi

      - name: Commit Release Version
        if: ${{ github.ref_name == 'develop' && steps.existing-release.outputs.version == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json idreesia-web/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.release-version.outputs.version }} for PR #${{ steps.merged-pr.outputs.number }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Tag Release Version
        if: ${{ github.ref_name == 'master' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.release-version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git tag -a "$tag" -m "Release ${{ steps.release-version.outputs.version }} for PR #${{ steps.merged-pr.outputs.number }}"
            git push origin "$tag"
          fi

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v3
        with:
          meteor-release: 3.6.1

      - run: meteor npm install -g yarn

      - name: Install Workspace Tooling
        run: meteor yarn install

      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev

      - name: Install Web Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-web
        env:
          OPENCV4NODEJS_DISABLE_AUTOBUILD: "1"

      - name: Install Mobile Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-mobile

      - name: Lint Workspace
        run: meteor yarn run lint

      - name: Typecheck Workspace
        run: meteor yarn run typecheck

      - name: Run Unit Tests
        run: meteor yarn run test:unit

      - name: Build Application
        run: meteor yarn run build-for-docker
        working-directory: ./idreesia-web

      - name: Build Mobile Server Bundle
        if: ${{ github.ref_name == 'master' }}
        run: meteor yarn run build-for-docker
        working-directory: ./idreesia-mobile

      - name: Build Docker Container
        if: ${{ github.ref_name == 'master' }}
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/idreesia-web
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          BUILD_ARGS=()
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=("-t" "$IMAGE_NAME:$tag")
          done
          docker build "${BUILD_ARGS[@]}" -f idreesia-web/Dockerfile.production idreesia-web

      # Mobile server: serves hot code push for the installed mobile apps. Same
      # release tags as the ERP image.
      - name: Build Mobile Docker Container
        if: ${{ github.ref_name == 'master' }}
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/idreesia-mobile
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          BUILD_ARGS=()
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=("-t" "$IMAGE_NAME:$tag")
          done
          docker build "${BUILD_ARGS[@]}" -f idreesia-mobile/Dockerfile.production idreesia-mobile

      # Rocket.Chat with the ERP's fixed settings baked in. It gets the same
      # release tags as the ERP image, so each ERP release has a matching
      # Rocket.Chat image.
      - name: Build Rocket.Chat Container
        if: ${{ github.ref_name == 'master' }}
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/idreesia-rocketchat
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          BUILD_ARGS=()
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=("-t" "$IMAGE_NAME:$tag")
          done
          # Links the new GHCR package to this repository so it inherits the
          # repository's access settings.
          docker build "${BUILD_ARGS[@]}" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            containers/rocketchat

      - name: Login to GHCR
        if: ${{ github.ref_name == 'master' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Docker Containers
        if: ${{ github.ref_name == 'master' }}
        env:
          OWNER: ghcr.io/${{ github.repository_owner }}
          DOCKER_TAGS: ${{ steps.release-version.outputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$DOCKER_TAGS"
          for image in idreesia-web idreesia-mobile idreesia-rocketchat; do
            for tag in "${TAGS[@]}"; do
              docker push "$OWNER/$image:$tag"
            done
          done

      - name: Install doctl
        if: ${{ github.ref_name == 'master' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to DigitalOcean App Platform
        if: ${{ github.ref_name == 'master' }}
        run: doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }} --wait

  # Store builds of the mobile app (idreesia-mobile). Only for releases to
  # master. Both jobs build the release tag, so a re-run of a release produces
  # the same app version. The run number is the store build number, which must
  # increase with every upload.
  #
  # URLs are set in the env block at the top. Secrets are listed in
  # docs/mobile-release-builds.md.
  mobile-android:
    needs: release
    if: ${{ github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    env:
      MOBILE_VERSION: ${{ needs.release.outputs.version }}
      MOBILE_BUILD_NUMBER: ${{ github.run_number }}
      MOBILE_RELEASE: 'true'
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v3
        with:
          meteor-release: 3.6.1

      - run: meteor npm install -g yarn

      - name: Install Workspace Tooling
        run: meteor yarn install

      - name: Install Mobile Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-mobile

      - name: Write Mobile Settings
        run: |
          jq -n \
            --arg backend "${{ env.MOBILE_BACKEND_URL }}" \
            --arg chat "${{ env.MOBILE_ROCKETCHAT_URL }}" \
            '{public: {backendUrl: $backend, rocketChatUrl: $chat}}' > "$RUNNER_TEMP/mobile-settings.json"

      # Meteor 3.5 can't create the Cordova project from scratch while
      # .meteor/cordova-plugins lists file:// plugins, so create it first
      # without them. See scripts/prepare-cordova-project.sh.
      - name: Prepare Cordova Project
        run: scripts/prepare-cordova-project.sh android "${{ env.MOBILE_SERVER_URL }}" "$RUNNER_TEMP/mobile-settings.json"

      # One Meteor build. By default it produces an unsigned .aab (for Google
      # Play) and keeps the generated Gradle project, which is reused below for
      # the .apk so the app is not bundled twice.
      # Caches Gradle dependencies and the wrapper distribution so most builds
      # don't hit Maven Central at all. The key changes when the Meteor release,
      # Cordova plugins or mobile dependencies change; restore-keys falls back
      # to the most recent cache so only the differences are downloaded.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('idreesia-mobile/.meteor/release', 'idreesia-mobile/.meteor/cordova-plugins', 'idreesia-mobile/yarn.lock') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Build Android Project
        run: |
          meteor build ../build/mobile-android \
            --platforms android \
            --server "${{ env.MOBILE_SERVER_URL }}" \
            --mobile-settings "$RUNNER_TEMP/mobile-settings.json"
        working-directory: ./idreesia-mobile
        env:
          METEOR_PACKAGE_DIRS: ../

      - name: Build Unsigned APK
        run: ./gradlew assembleRelease -q
        working-directory: ./build/mobile-android/android/project

      - name: Sign AAB And APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          android_out=build/mobile-android/android
          unsigned_aab="$android_out/app-release.aab"
          unsigned_apk="$android_out/project/app/build/outputs/apk/release/app-release-unsigned.apk"
          for f in "$unsigned_aab" "$unsigned_apk"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected build output not found: $f"
              exit 1
            fi
          done
          mkdir -p build/artifacts

          # .apk: align, then sign with apksigner.
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.apk"

          # Unversioned copy of the same signed APK, so the stable URL
          # releases/latest/download/idreesia-mobile.apk always works.
          cp "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.apk" build/artifacts/idreesia-mobile.apk

          # .aab: apksigner does not handle bundles, so use jarsigner.
          cp "$unsigned_aab" "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.aab"
          jarsigner \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.aab" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "build/artifacts/idreesia-mobile-${MOBILE_VERSION}.aab"

          rm "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"

      - name: Upload Android Builds
        uses: actions/upload-artifact@v4
        with:
          name: idreesia-mobile-android-${{ needs.release.outputs.version }}
          path: |
            build/artifacts/*.apk
            build/artifacts/*.aab
          if-no-files-found: error

  mobile-ios:
    needs: release
    if: ${{ github.ref_name == 'master' }}
    runs-on: macos-latest
    env:
      MOBILE_VERSION: ${{ needs.release.outputs.version }}
      MOBILE_BUILD_NUMBER: ${{ github.run_number }}
      MOBILE_RELEASE: 'true'
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v3
        with:
          meteor-release: 3.6.1

      - run: meteor npm install -g yarn

      - name: Install Workspace Tooling
        run: meteor yarn install

      - name: Install Mobile Dependencies
        run: meteor yarn install
        working-directory: ./idreesia-mobile

      - name: Write Mobile Settings
        run: |
          jq -n \
            --arg backend "${{ env.MOBILE_BACKEND_URL }}" \
            --arg chat "${{ env.MOBILE_ROCKETCHAT_URL }}" \
            '{public: {backendUrl: $backend, rocketChatUrl: $chat}}' > "$RUNNER_TEMP/mobile-settings.json"

      # Meteor 3.5 can't create the Cordova project from scratch while
      # .meteor/cordova-plugins lists file:// plugins, so create it first
      # without them. See scripts/prepare-cordova-project.sh.
      - name: Prepare Cordova Project
        run: scripts/prepare-cordova-project.sh ios "${{ env.MOBILE_SERVER_URL }}" "$RUNNER_TEMP/mobile-settings.json"

      - name: Build iOS Project
        run: |
          meteor build ../build/mobile-ios \
            --platforms ios \
            --server "${{ env.MOBILE_SERVER_URL }}" \
            --mobile-settings "$RUNNER_TEMP/mobile-settings.json"
        working-directory: ./idreesia-mobile
        env:
          METEOR_PACKAGE_DIRS: ../

      - name: Import Signing Certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(uuidgen)
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archive And Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cd build/mobile-ios/ios/project
          # Xcode refers to the app's own Cordova plugins (cordova-plugins/) by
          # a relative path that only works from Meteor's working folder. Point
          # it at the repository checkout instead.
          sed -i '' -E "s#(\.\./)+cordova-plugins/#${GITHUB_WORKSPACE}/cordova-plugins/#g" \
            "Eastern Breeze ERP.xcodeproj/project.pbxproj"
          if ! grep -q "${GITHUB_WORKSPACE}/cordova-plugins/" "Eastern Breeze ERP.xcodeproj/project.pbxproj"; then
            echo "::error::Could not rewrite the cordova-plugins paths in the Xcode project."
            exit 1
          fi
          container=(-workspace "Eastern Breeze ERP.xcworkspace")
          scheme="Eastern Breeze ERP"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.easternbreeze.erp</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST

          xcodebuild archive "${container[@]}" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/artifacts"
          cd "$GITHUB_WORKSPACE/build/artifacts"
          mv ./*.ipa "idreesia-mobile-${MOBILE_VERSION}.ipa"

      - name: Remove Signing Keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: idreesia-mobile-ios-${{ needs.release.outputs.version }}
          path: build/artifacts/*.ipa
          if-no-files-found: error

  # Publishes a GitHub Release for the tag with the signed mobile builds
  # attached. Re-runs of the same release replace the files.
  github-release:
    needs: [release, mobile-android, mobile-ios]
    # always() lets this run when one mobile build failed; it still requires
    # `release` to pass and at least one mobile build to have succeeded. Only
    # the successful build's artifacts exist, so only those get attached.
    if: >-
      ${{ always()
      && github.ref_name == 'master'
      && needs.release.result == 'success'
      && (needs.mobile-android.result == 'success' || needs.mobile-ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - name: Download Mobile Builds
        uses: actions/download-artifact@v4
        with:
          pattern: idreesia-mobile-*
          path: mobile-builds
          merge-multiple: true

      - name: Create Or Update GitHub Release
        run: |
          set -euo pipefail
          # Immutable releases reject asset uploads once published, so the
          # release is created as a draft, filled, and only then published.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published and immutable; assets cannot be added."
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" mobile-builds/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
