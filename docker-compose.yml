services:
  mongo:
    build:
      context: ./containers/mongo
    # The atlas-local runner names the replica set after the container
    # hostname and starts mongod with --replSet <hostname>. Left to Docker's
    # random per-container hostname, every recreate invalidates the replica
    # set config stored in /data/db ("our replica set config is invalid or we
    # are not a member of it"), so the hostname is pinned here.
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev:/data/db
      # The atlas-local runner generates the replica-set keyfile into
      # /data/configdb on first start only - once /data/db is initialised it
      # never regenerates it. That path is an anonymous volume in the image,
      # so a container recreate that drops it leaves mongod starting with
      # --keyFile pointing at nothing ("Unable to acquire security key[s]").
      # Naming the volume keeps the keyfile alongside the data it belongs to.
      - mongo-config-dev:/data/configdb
      # mongot keeps the search/vector index data here, and unlike /data/db
      # and /data/configdb the image does not declare it as a volume - so
      # without this the search indexes are thrown away on every recreate
      # while the migration that created them stays marked as applied.
      - mongo-search-dev:/data/mongot

  # S3-compatible object storage. MinIO no longer publishes pullable images,
  # so RustFS stands in for it. Only path-style addressing is supported, so
  # S3 clients need forcePathStyle.
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001" # Console
    environment:
      RUSTFS_ACCESS_KEY: rustfs_root_user
      RUSTFS_SECRET_KEY: rustfs_root_user_password
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # The RustFS image has no mc, so the default bucket is created with the
  # AWS CLI instead.
  rustfs-defaultbuckets:
    image: amazon/aws-cli:2.22.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfs_root_user
      AWS_SECRET_ACCESS_KEY: rustfs_root_user_password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3 mb s3://idreesia-files;
      exit 0;
      "

  idreesia-web:
    build:
      context: .
      dockerfile: ./idreesia-web/Dockerfile.development
    platform: linux/amd64
    depends_on:
      - mongo
      - rustfs
    env_file:
      - ./idreesia-web/.env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Named volumes, not part of the bind-mounted repo above, for
      # everything this container writes to at install/build time - keeps
      # container-owned files out of your actual working tree entirely.
      - idreesia-web-node-modules:/app/idreesia-web/node_modules
      - idreesia-web-meteor-local:/app/idreesia-web/.meteor/local
      - idreesia-common-node-modules:/app/idreesia-common/node_modules
      - root-node-modules:/app/node_modules

volumes:
  rustfs-dev: {}
  mongo-dev: {}
  mongo-config-dev: {}
  mongo-search-dev: {}
  idreesia-web-node-modules: {}
  idreesia-web-meteor-local: {}
  idreesia-common-node-modules: {}
  root-node-modules: {}
