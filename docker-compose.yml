services:
  mongo:
    build:
      context: ./containers/mongo
    # The atlas-local runner names the replica set after the container
    # hostname and starts mongod with --replSet <hostname>. Left to Docker's
    # random per-container hostname, every recreate invalidates the replica
    # set config stored in /data/db ("our replica set config is invalid or we
    # are not a member of it"), so the hostname is pinned here.
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev:/data/db
      # The atlas-local runner generates the replica-set keyfile into
      # /data/configdb on first start only - once /data/db is initialised it
      # never regenerates it. That path is an anonymous volume in the image,
      # so a container recreate that drops it leaves mongod starting with
      # --keyFile pointing at nothing ("Unable to acquire security key[s]").
      # Naming the volume keeps the keyfile alongside the data it belongs to.
      - mongo-config-dev:/data/configdb
      # mongot keeps the search/vector index data here, and unlike /data/db
      # and /data/configdb the image does not declare it as a volume - so
      # without this the search indexes are thrown away on every recreate
      # while the migration that created them stays marked as applied.
      - mongo-search-dev:/data/mongot

  # S3-compatible object storage. MinIO no longer publishes pullable images,
  # so RustFS stands in for it. Only path-style addressing is supported, so
  # S3 clients need forcePathStyle.
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9001:9001" # Console
    environment:
      RUSTFS_ACCESS_KEY: rustfs_root_user
      RUSTFS_SECRET_KEY: rustfs_root_user_password
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # The RustFS image has no mc, so the default bucket is created with the
  # AWS CLI instead.
  rustfs-defaultbuckets:
    image: amazon/aws-cli:2.22.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfs_root_user
      AWS_SECRET_ACCESS_KEY: rustfs_root_user_password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3 mb s3://idreesia-files;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://rocketchat;
      exit 0;
      "

  # Rocket.Chat shares the mongo service above (its own `rocketchat`
  # database) rather than running a second mongod - it only needs a replica
  # set, which atlas-local already initialises. Published on 3100 because the
  # ERP owns 3000. No TRANSPORTER is set, so it runs as a single monolith
  # process without NATS. Fixed policy settings (login, profiles, Livechat
  # routing) are baked into containers/rocketchat/Dockerfile; only
  # environment-specific values are set here.
  rocketchat:
    build:
      context: ./containers/rocketchat
    depends_on:
      mongo:
        condition: service_started
      rustfs-defaultbuckets:
        condition: service_completed_successfully
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?directConnection=true
      ROOT_URL: http://localhost:3100
      DEPLOY_METHOD: docker
      DEPLOY_PLATFORM: compose
      # Seed a local admin so the dev instance is usable straight away.
      ADMIN_USERNAME: admin
      ADMIN_PASS: admin
      ADMIN_EMAIL: admin@idreesia.local
      # Required with every users.createToken call (the image sets
      # CREATE_TOKENS_FOR_USERS). The ERP sends it as
      # ROCKETCHAT_CREATE_TOKENS_SECRET, so the two must match. Dev-only
      # value; production sets its own on the App Platform component.
      CREATE_TOKENS_FOR_USERS_SECRET: dev-create-tokens-secret
      # Password login form. The image defaults it to "false"; this overrides
      # it for the one-time setup (signing in as admin and as the ERP service
      # account, see docs/rocket-chat-integration.md). Remove this line, or set
      # it to "false", afterwards so ERP users can only get in through the ERP.
      OVERWRITE_SETTING_Accounts_ShowFormLogin: "true"
      # The mobile app's public chat page calls the Livechat visitor API
      # directly from its WebView (another origin), so the REST API needs CORS.
      # Tighten the origin list for production.
      OVERWRITE_SETTING_API_Enable_CORS: "true"
      OVERWRITE_SETTING_API_CORS_Origin: "*"
      # File uploads, avatars and user data exports go to the `rocketchat`
      # bucket on RustFS instead of GridFS. RustFS only does path-style
      # addressing, hence ForcePathStyle. The endpoint is the in-network
      # hostname, which browsers can't reach (9000 isn't published), so all
      # three proxy settings make Rocket.Chat stream files itself rather than
      # redirecting clients to a pre-signed rustfs:9000 URL.
      OVERWRITE_SETTING_FileUpload_Storage_Type: AmazonS3
      OVERWRITE_SETTING_FileUpload_S3_BucketURL: http://rustfs:9000
      OVERWRITE_SETTING_FileUpload_S3_Bucket: rocketchat
      OVERWRITE_SETTING_FileUpload_S3_Region: us-east-1
      OVERWRITE_SETTING_FileUpload_S3_AWSAccessKeyId: rustfs_root_user
      OVERWRITE_SETTING_FileUpload_S3_AWSSecretAccessKey: rustfs_root_user_password
      OVERWRITE_SETTING_FileUpload_S3_ForcePathStyle: "true"
      OVERWRITE_SETTING_FileUpload_S3_Proxy_Uploads: "true"
      OVERWRITE_SETTING_FileUpload_S3_Proxy_Avatars: "true"
      OVERWRITE_SETTING_FileUpload_S3_Proxy_UserDataFiles: "true"
    ports:
      - "3100:3000"

  idreesia-web:
    build:
      context: .
      dockerfile: ./idreesia-web/Dockerfile.development
    platform: linux/amd64
    depends_on:
      - mongo
      - rustfs
    env_file:
      - ./idreesia-web/.env
    environment:
      # The native file watcher can't poll the bind-mounted repo on Docker
      # Desktop (EINTR errors on every startup); poll instead.
      METEOR_WATCH_FORCE_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Named volumes, not part of the bind-mounted repo above, for
      # everything this container writes to at install/build time - keeps
      # container-owned files out of your actual working tree entirely.
      - idreesia-web-node-modules:/app/idreesia-web/node_modules
      - idreesia-web-meteor-local:/app/idreesia-web/.meteor/local
      - idreesia-common-node-modules:/app/idreesia-common/node_modules
      - root-node-modules:/app/node_modules

volumes:
  rustfs-dev: {}
  mongo-dev: {}
  mongo-config-dev: {}
  mongo-search-dev: {}
  idreesia-web-node-modules: {}
  idreesia-web-meteor-local: {}
  idreesia-common-node-modules: {}
  root-node-modules: {}
