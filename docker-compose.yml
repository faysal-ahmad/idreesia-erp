version: "3"
services:
  mongo:
    build:
      context: ./containers/mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev:/data/db

  idreesia-web:
    build:
      context: .
      dockerfile: ./idreesia-web/Dockerfile.development
    platform: linux/amd64
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017/idreesia-erp
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Named volumes, not part of the bind-mounted repo above, for
      # everything this container writes to at install/build time - keeps
      # container-owned files out of your actual working tree entirely.
      #
      # One volume split via subpaths was tried first, but Docker's subpath
      # mount requires the subpath to already exist inside the volume - unlike
      # a plain whole-volume mount, it won't auto-create/seed it, so it fails
      # outright against a fresh volume. Separate volumes don't have that
      # problem: each is auto-created and seeded from the image normally.
      - idreesia-web-node-modules:/app/idreesia-web/node_modules
      - idreesia-web-meteor-local:/app/idreesia-web/.meteor/local
      - idreesia-common-node-modules:/app/idreesia-common/node_modules
      - root-node-modules:/app/node_modules

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9000:9000"
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minio_root_user
      MINIO_ROOT_PASSWORD: minio_root_user_password
    volumes:
      - minio-dev:/data:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    command: server --console-address ":9001" /data

  minio-defaultbuckets:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_root_user minio_root_user_password;
      /usr/bin/mc mb myminio/idreesia-files;
      exit 0;
      "

volumes:
  minio-dev: {}
  mongo-dev: {}
  idreesia-web-node-modules: {}
  idreesia-web-meteor-local: {}
  idreesia-common-node-modules: {}
  root-node-modules: {}
