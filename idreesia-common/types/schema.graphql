    workspaceDeleteProject(
      committeeId: String!
      projectId: String!
      deleteTasks: Boolean
    ): Boolean

    workspaceCreateTask(
      committeeId: String!
      input: WorkspaceTaskInput!
    ): WorkspaceTaskType
    workspaceUpdateTask(
      committeeId: String!
      taskId: String!
      input: WorkspaceTaskInput!
    ): WorkspaceTaskType
    workspaceDeleteTask(committeeId: String!, taskId: String!): Boolean
    # Also by the task's assignee, for their own task.
    workspaceSetTaskStatus(
      committeeId: String!
      taskId: String!
      status: String!
    ): WorkspaceTaskType
    workspaceSetTaskProgress(
      committeeId: String!
      taskId: String!
      progress: Int!
    ): WorkspaceTaskType
    # Any committee member.
    workspaceAddTaskComment(
      committeeId: String!
      taskId: String!
      text: String!
    ): WorkspaceTaskCommentType
    # The author or a coordinator.
    workspaceDeleteTaskComment(
      committeeId: String!
      commentId: String!
    ): Boolean

    workspaceSendProjectDiscussionMessage(
      committeeId: String!
      projectId: String!
      text: String!
      threadId: String
    ): Boolean!
    workspaceReactToProjectDiscussionMessage(
      committeeId: String!
      projectId: String!
      messageId: String!
      emoji: String!
      shouldReact: Boolean!
    ): Boolean!
    workspaceSetProjectDiscussionMessageStarred(
      committeeId: String!
      projectId: String!
      messageId: String!
      starred: Boolean!
    ): Boolean!
    workspaceSetProjectDiscussionMessagePinned(
      committeeId: String!
      projectId: String!
      messageId: String!
      pinned: Boolean!
    ): Boolean!
    workspaceEditProjectDiscussionMessage(
      committeeId: String!
      projectId: String!
      messageId: String!
      text: String!
    ): Boolean!
    workspaceDeleteProjectDiscussionMessage(
      committeeId: String!
      projectId: String!
      messageId: String!
    ): Boolean!
  }
