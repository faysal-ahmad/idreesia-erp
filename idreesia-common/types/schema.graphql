  }

  type WorkspaceTaskCommentType {
    _id: String
    taskId: String
    text: String
    authorName: String
    isOwn: Boolean
    canDelete: Boolean
    createdAt: String
  }

  type PagedWorkspaceTaskCommentType {
    data: [WorkspaceTaskCommentType]
    totalResults: Int
  }

  type WorkspaceProjectsActivityType {
    _id: String
    action: String
    entityType: String
    entityId: String
    projectId: String
    taskId: String
    userName: String
    at: String
    # JSON
    details: String
  }

  input WorkspaceProjectInput {
    title: String!
    objective: String
    description: String
    participantIds: [String]
    startDate: String
    targetDate: String
    tags: [String]
  }

  input WorkspaceTaskInput {
    title: String!
    description: String
