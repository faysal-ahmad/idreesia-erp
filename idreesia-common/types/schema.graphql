    @checkPermissions(permissions: [ADMIN_MANAGE_SCHEDULED_JOBS])

  resetJobDefinitionSchedule(_id: String!): JobDefinitionType
    @checkPermissions(permissions: [ADMIN_MANAGE_SCHEDULED_JOBS])

