  toDate: String
  numOfDays: Float
  stayReason: String
}

type WorkspaceNightStayType {
  _id: String
  visitorId: String
  fromDate: String
  toDate: String
  numOfDays: Float
  stayReason: String
  stayAllowedBy: String
  visitorName: String
  visitorImageUrl: String
